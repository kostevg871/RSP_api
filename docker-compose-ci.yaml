services:
  db:
    image: postgres:14.1-alpine
    container_name: db_RSP
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - custom
  app:
    container_name: rsp
    image: rsp_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    #command: ["/rsp/docker/app.sh"]
    ports:
      - "9999:8000"
    depends_on:
      - db
    networks:
      - custom

networks:
  custom:
    driver: bridge