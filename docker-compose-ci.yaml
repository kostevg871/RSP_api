version: '3.8'

services:
  db:
    image: postgres:14.1-alpine
    container_name: db_RSP
    restart: always
    env_file:
      - .env-non-dev
    ports:
      - "5432:5432"
    networks:
      - custom
  app:
    container_name: rsp
    image: rsp_app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION}
        ACCESS_TOKEN: ${ACCESS_TOKEN}
    env_file:
      - .env-non-dev
      - .env_rsp
    environment:
      DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["/bin/bash", "-c", "/rsp/docker/app.sh"]
    ports:
      - "9999:8000"
    depends_on:
      - db
    networks:
      - custom

networks:
  custom:
    driver: bridge